# Local development services only. No production configuration, no real data.
name: probash-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: probash-postgres
    environment:
      POSTGRES_USER: probash
      POSTGRES_PASSWORD: probash
      POSTGRES_DB: probash
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U probash -d probash']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: probash-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.0
    container_name: probash-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: probash
      POSTGRES_PWD: probash
      POSTGRES_SEEDS: postgres
    ports:
      - '7233:7233'

  temporal-ui:
    image: temporalio/ui:2.42.0
    container_name: probash-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '8233:8080'

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: probash-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: probash
      MINIO_ROOT_PASSWORD: probash-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 probash probash-dev-secret &&
      mc mb --ignore-existing local/probash-documents &&
      mc version enable local/probash-documents &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
