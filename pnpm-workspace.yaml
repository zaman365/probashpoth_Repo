packages:
  - 'apps/web'
  - 'apps/api'
  - 'apps/mobile'
  - 'packages/*'
# Install scripts are opt-in. esbuild ships a platform binary through its install
# script (tsx depends on it); @scarf/scarf is analytics and stays blocked.
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.12'
  - '@turbo/darwin-arm64@2.10.12'
  - '@turbo/linux-64@2.10.12'
  - '@turbo/linux-arm64@2.10.12'
  - '@turbo/windows-64@2.10.12'
  - '@turbo/windows-arm64@2.10.12'
  - turbo@2.10.12
  - '@nestjs/common@11.2.3'
  - '@nestjs/core@11.2.3'
  - '@nestjs/platform-fastify@11.2.3'
  - '@nestjs/testing@11.2.3'
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3

# The Expo mobile app is included in the default workspace. The Tauri operations
# shell remains outside the default install because its Rust toolchain is optional.
# See apps/mobile/README.md and apps/ops-desktop/README.md.
